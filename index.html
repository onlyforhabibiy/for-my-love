<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Habibiyimga ❤️ | 4 yilligimiz</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#7b2149}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(circle at 15% 15%,#ffe5f0,transparent 35%),linear-gradient(145deg,#fff5f8,#ffd0e1 55%,#fbb6d0);display:grid;place-items:center;overflow:hidden;padding:18px 18px 205px}.card{position:relative;z-index:2;width:min(100%,430px);min-height:440px;background:#ffffffd9;backdrop-filter:blur(12px);border:1px solid #fff;border-radius:30px;box-shadow:0 20px 60px #c8528350;padding:35px 25px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.symbol{font-size:65px;animation:pulse 1.6s infinite}h1{font-size:clamp(26px,7vw,35px);margin:12px 0;color:#b82460}p{font-size:17px;line-height:1.65;margin:10px 0 22px}.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%;min-height:60px;align-items:center}button{border:0;border-radius:100px;padding:15px 23px;font-weight:750;font-size:16px;cursor:pointer;touch-action:manipulation}button.primary{background:#e93d81;color:white;box-shadow:0 8px 18px #e93d814d}button.secondary{background:#ffe0ed;color:#a72b61}textarea{width:100%;min-height:105px;border:2px solid #f4a9c8;border-radius:17px;padding:14px;font:inherit;color:#7b2149;background:#fff9;resize:vertical}textarea:focus{outline:2px solid #e93d81}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible{outline:3px solid #852456;outline-offset:3px}.progress{font-size:13px;color:#aa6785;margin-bottom:14px}.heart{position:fixed;bottom:-35px;pointer-events:none;animation:float linear forwards;z-index:1;opacity:.65}.music{position:fixed;right:15px;top:15px;z-index:5;background:#fff9;color:#b82460;padding:11px 14px;font-size:13px}.small{font-size:13px;color:#995b75;margin-top:16px}.no{position:relative;transition:transform .15s}.confetti{position:fixed;top:-25px;pointer-events:none;z-index:4;animation:fall linear forwards}@keyframes float{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}@keyframes fall{to{transform:translateY(110vh) rotate(700deg);opacity:0}}@keyframes pulse{50%{transform:scale(1.12)}}@media(prefers-reduced-motion:reduce){.symbol{animation:none}}
</style>
</head>
<body>
<audio id="music" src="music.mp3" preload="none" loop></audio>
<button id="music-toggle" class="music" hidden type="button">🔊 Musiqa</button>
<main class="card" id="card" aria-live="polite"></main>
<script>
const card=document.getElementById('card');let step=-1,answer='';
const music=document.getElementById('music'),musicToggle=document.getElementById('music-toggle');
function startMusic(){musicToggle.hidden=false;music.play().catch(()=>{musicToggle.textContent='▶️ Musiqani yoqish'});musicToggle.textContent='🔊 Musiqa';}
function stopMusic(){music.pause();music.currentTime=0;musicToggle.hidden=true;}
musicToggle.onclick=()=>{if(music.paused){music.play().then(()=>musicToggle.textContent='🔊 Musiqa').catch(()=>{});}else{music.pause();musicToggle.textContent='🔇 Musiqa';}};
function render(){let html='';if(step===-1)html=`<div class="symbol">🎶</div><h1>Habibiy, musiqa eshitamizmi? ❤️</h1><p>Sanga bitta chiroyli qo‘shiq tanladim...</p><div class="buttons"><button class="primary" id="yes-music">Ha, eshitamiz ❤️</button><button class="secondary" id="no-music">Yo‘q, musiqasiz davom etamiz</button></div><div class="small">Sanga yoqadi, menimcha 🥹💕</div>`;if(step===0)html=`<div class="symbol">💌</div><h1>Habibiy! ❤️</h1><p>Bugun sen uchun kichkina syurprizim bor. Faqat 3 ta savolimga javob ber! 🥰</p><div class="buttons"><button class="primary" data-next>Syurprizni boshlash 💕</button></div><div class="small">4 yil — eng go‘zal hikoyamiz 💍</div>`;
if(step===1)html=`<div class="progress">1 / 3 savol</div><div class="symbol">🌹</div><h1>Bugun qanday kun? 😍</h1><p>Bir oz o‘ylab ko‘r, Chiroyligim...</p><div class="buttons"><button class="primary" data-next>Bizning kunimiz ❤️</button><button class="secondary no" id="wrong-day">Bilmadim, oddiy kun 🙈</button></div>`;
if(step===2)html=`<div class="progress">2 / 3 savol</div><div class="symbol">💕</div><h1>Chiroyligim, bitta savol... ❤️</h1><p>Shu 4 yil ichida seni eng ko‘p xursand qilgan narsa nima?</p><div class="buttons"><button class="primary" id="love-answer">Bu sizning sevgingiz 😁❤️</button></div><div id="custom-area" style="width:100%;margin-top:14px"><textarea id="custom-text" maxlength="500" placeholder="O‘zingni javobingni shu yerga yozsang bo‘ladi, jonim ❤️"></textarea><div class="buttons" style="margin-top:12px"><button class="primary" id="save-answer" disabled>Davom etish 💌</button></div></div>`;
if(step===3)html=`<div class="progress">3 / 3 savol</div><div class="symbol">💍</div><h1>Yana bir savol!</h1><p>Yana 100 yil birga kulib, birga orzu qilishga tayyormisan, Oyisi?</p><div class="buttons"><button class="primary" data-next>Albatta! 🥹</button><button class="secondary" data-next>100 yil ham kam! 💖</button></div>`;
if(step===4)html=`<div class="symbol">🥰</div><h1>Habibiy, bugun vaqtni birga o‘tkazamizmi?</h1><p>Bugun hamma tashvishni bir chetga surib, ozgina vaqtni faqat bir-birimizga ajratsak nima deysan? 🌹</p><div class="buttons"><button class="primary" id="yes">Ha, albatta! ❤️</button><button class="secondary no" id="no">Yo‘q 🙈</button></div><div class="small">Kichkina maslahat: yuragingni tingla 😉</div>`;
if(step===5)html=`<div class="symbol">💖</div><h1>Yashasin! 🎉</h1><p>Chiroyligim, san bilan o‘tgan 4 yil — hayotimdagi eng chiroyli sovg‘a. Sani har kuni yanada ko‘proq sevaman! ❤️<br><br><strong>Bugun vaqtimiz faqat ikkalamiz uchun! 🌹</strong></p><div class="buttons"><button class="primary" id="again">Yana boshidan 💌</button></div><div class="small">4 yilligimiz muborak, Habibiy! Sani sevaman! 💍</div>`;
card.innerHTML=html;if(step===-1){document.getElementById('yes-music').onclick=()=>{startMusic();step=0;render()};document.getElementById('no-music').onclick=()=>{stopMusic();step=0;render()}}card.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',()=>{step++;render()}));if(step===2){const save=value=>{answer=value;try{localStorage.setItem('komila_second_answer',value)}catch(e){}step=3;render()};document.getElementById('love-answer').onclick=()=>save('Bu sizning sevgingiz 😁❤️');const field=document.getElementById('custom-text'),btn=document.getElementById('save-answer');field.oninput=()=>btn.disabled=!field.value.trim();btn.onclick=()=>{if(field.value.trim())save(field.value.trim())}}if(step===1){attachDodgingButton(document.getElementById('wrong-day'),['Yo‘q, o‘ylab ko‘r 😜','Nahotki bilmaysan? 😂','Qochdim! 💕','Bilmadim, oddiy kun 🙈'])}if(step===4){document.getElementById('yes').onclick=()=>{step=5;render();celebrate()};const no=document.getElementById('no');const escape=()=>{const x=(Math.random()-.5)*Math.min(170,innerWidth*.42),y=(Math.random()-.5)*120;no.style.transform=`translate(${x}px,${y}px)`;no.textContent=['Tutolmaysan 😜','Boshqa javob yo‘q ❤️','Yana urinib ko‘r 😂','Yo‘q 🙈'][Math.floor(Math.random()*4)]};no.addEventListener('pointerenter',escape);no.addEventListener('touchstart',e=>{e.preventDefault();escape()},{passive:false});no.addEventListener('pointerdown',e=>{e.preventDefault();escape()});no.addEventListener('click',e=>{e.preventDefault();escape()})}if(step===5)document.getElementById('again').onclick=()=>{stopMusic();step=0;render()}}
function attachDodgingButton(btn,labels){const escape=e=>{if(e&&e.cancelable)e.preventDefault();const x=(Math.random()-.5)*Math.min(170,innerWidth*.42),y=(Math.random()-.5)*120;btn.style.transform=`translate(${x}px,${y}px)`;btn.textContent=labels[Math.floor(Math.random()*labels.length)]};btn.addEventListener('pointerenter',escape);btn.addEventListener('touchstart',escape,{passive:false});btn.addEventListener('pointerdown',escape);btn.addEventListener('click',escape)}
function heart(){const h=document.createElement('span');h.className='heart';h.textContent=['❤️','💕','💗','🌸'][Math.floor(Math.random()*4)];h.style.left=Math.random()*100+'vw';h.style.fontSize=15+Math.random()*22+'px';h.style.animationDuration=5+Math.random()*5+'s';document.body.append(h);setTimeout(()=>h.remove(),11000)}setInterval(heart,650);
function celebrate(){for(let i=0;i<70;i++){const el=document.createElement('span');el.className='confetti';el.textContent=['💖','🌹','✨','💕'][i%4];el.style.left=Math.random()*100+'vw';el.style.fontSize=16+Math.random()*18+'px';el.style.animationDuration=2+Math.random()*3+'s';el.style.animationDelay=Math.random()*1.5+'s';document.body.append(el);setTimeout(()=>el.remove(),6500)}}render();
</script>
</body>
</html>
